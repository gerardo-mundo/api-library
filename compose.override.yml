services:
  db:
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: librarypassword
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  # This is the base config for the dev environment
  api:
    image: ${DOCKER_USERNAME}/api-library:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      - db
      - redis

spring.application.name=api-library
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/library_db
spring.datasource.username=user_admin
spring.datasource.password=librarypassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable Hibernate's automatic schema changes
spring.jpa.hibernate.ddl-auto=none

# Force Flyway to clean up if things are messy (only for development!)
# spring.flyway.clean-on-validation-error=true
spring.flyway.baseline-on-migrate=true

# Disable seeding in production
app.seeding.enabled=true
